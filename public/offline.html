<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Whisper</title>
    <!--
      THIS PAGE IS NO LONGER THE OFFLINE EXPERIENCE, AND NO LONGER SAYS ANYBODY
      IS OFFLINE.

      It used to be the "Reconnecting — still offline, watching for a connection"
      screen, and the service worker served it to people who were perfectly
      online: the old navigation handler gave the server 2.5s and answered with
      this file whenever the route had no cache entry, which on a cold serverless
      boot is most routes. That is fixed in public/sw.js, which now restores a
      snapshot of the last visited page instead and never references this file.

      What is left here serves exactly one case: the Capacitor shell's
      `errorPath` (capacitor.config.ts), reached when the native WebView's very
      first load of `server.url` fails outright — no worker installed yet, no
      cache, nothing to restore. In that moment there is no last visit on this
      device to show, so the honest thing is a quiet splash that keeps trying
      and opens the app by itself the instant the server answers. No countdown,
      no "offline", no claim about the user's connection — a phone can be fully
      connected while a server sleeps, and saying otherwise is what made the old
      page feel like a lie.

      WHY THE RETRY TARGET IS ABSOLUTE

      It navigates to APP_ORIGIN below, not "/". This document is served from the
      *bundled* assets, and with `androidScheme: "https"` those live at
      `https://localhost/`. A relative path therefore resolved to the local
      bundle root — a Capacitor placeholder — and not to the app at all. The
      origin is duplicated from capacitor.config.ts's `server.url`; if that ever
      changes, change it here too.
    -->
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #05010f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 22rem; }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        h1 {
            font-size: 1.875rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 0;
            background: linear-gradient(100deg, #22d3ee, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin: 0.875rem 0 0;
            font-size: 0.9375rem;
            line-height: 1.55;
        }
        .btn {
            display: block;
            width: 100%;
            margin-top: 2rem;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 1.125rem;
            background: linear-gradient(100deg, #22d3ee, #a855f7);
            color: #05050a;
            font-family: inherit;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 10px 24px -8px rgba(120, 90, 250, 0.55);
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn:active { transform: scale(0.97); }
        .btn[disabled] { opacity: 0.6; }
        .status {
            margin-top: 1rem;
            min-height: 1.25rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #64748b;
        }
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 0.4375rem;
            border-radius: 999px;
            background: #a78bfa;
            vertical-align: middle;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.25; }
        }
        @media (prefers-reduced-motion: reduce) {
            .icon, .dot { animation: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="ghost.png" alt="" class="icon">
        <h1>Opening Whisper</h1>
        <p>One moment &mdash; we&rsquo;re taking you straight back in.</p>

        <button class="btn" id="open" type="button">Open Whisper</button>
        <p class="status" id="status"><span class="dot"></span>Warming up&hellip;</p>
    </div>

    <script>
    (function () {
      /* Absolute, because a relative path resolves against the bundled assets at
         https://localhost — see the comment in <head>. */
      var APP_ORIGIN = "https://whisper-anonymous.vercel.app";
      var ENTRY_PATH = "/dashboard";

      var open = document.getElementById("open");
      var status = document.getElementById("status");
      var navigating = false;
      var misses = 0;

      function enter() {
        if (navigating) return;
        navigating = true;
        status.innerHTML = '<span class="dot"></span>Opening&hellip;';
        /* `replace`, so the back gesture cannot return to this page once the app
           has loaded. */
        window.location.replace(APP_ORIGIN + ENTRY_PATH);
      }

      /*
       * A real request, not `navigator.onLine`. On Android that flag reports true
       * for a captive portal, a hotspot with no upstream, and a data connection
       * that has not finished attaching — all of which would bounce someone into
       * a navigation that fails again and returns them right back here.
       *
       * `no-store` keeps a cached 200 from standing in for a live server.
       */
      function probe() {
        if (navigating) return;
        fetch(APP_ORIGIN + "/favicon.ico?probe=" + Date.now(), {
          method: "HEAD",
          cache: "no-store",
        })
          .then(function (response) {
            if (response && (response.ok || response.type === "opaque")) enter();
          })
          .catch(function () {
            /* Not yet. Only after several misses does the page say anything at
               all, and even then it talks about the server, not the user's
               connection — the two are not the same thing. */
            misses += 1;
            if (misses === 3) {
              status.innerHTML = '<span class="dot"></span>Server hasn&rsquo;t answered yet &mdash; still trying&hellip;';
            }
          });
      }

      open.addEventListener("click", function () {
        open.disabled = true;
        status.innerHTML = '<span class="dot"></span>Opening&hellip;';
        probe();
        setTimeout(function () {
          if (navigating) return;
          open.disabled = false;
          status.innerHTML = '<span class="dot"></span>Not there yet &mdash; tap again or wait, we&rsquo;re watching&hellip;';
        }, 2500);
      });

      /* The browser's own signal is a useful hint for *when* to probe, even though
         it is not trustworthy enough to act on by itself. */
      window.addEventListener("online", probe);

      /* Coming back from the app switcher is the other common moment for the
         server to have become reachable. */
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) probe();
      });

      /* Every 3s: this page only exists at cold start, so it should retire
         itself quickly rather than be sat on. */
      setInterval(probe, 3000);
      probe();
    })();
    </script>
</body>
</html>
