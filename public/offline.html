<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Whisper - Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0f0529, #05010f);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin: 0;
        }
        p {
            color: #94a3b8;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        button {
            margin-top: 2rem;
            background: linear-gradient(to right, #22d3ee, #a855f7);
            border: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            color: black;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 10px 15px -3px rgba(34, 211, 238, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">👻</div>
        <h1>Whisper</h1>
        <p>You're offline. Please connect to the internet to continue your whispers.</p>
        <button onclick="window.location.href='/'">Retry Connection</button>
    </div>
</body>
</html>
