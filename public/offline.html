<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Whisper - Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #05010f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to right, #22d3ee, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin-top: 1rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        .btn {
            margin-top: 2.5rem;
            background: linear-gradient(to right, #22d3ee, #a855f7);
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 1.2rem;
            color: black;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px -5px rgba(34, 211, 238, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">👻</div>
        <h1>Connection Lost</h1>
        <p>Your inbox is safely stored, but we can't reach the server right now.<br>Check your internet and try again.</p>
        <button class="btn" onclick="window.location.href='/'">RETRY CONNECTION</button>
    </div>
</body>
</html>
